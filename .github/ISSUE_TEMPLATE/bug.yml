name: 버그
description: 잘못 동작하는 것을 알려 주세요
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: 어디서
      placeholder: 예) /studio 영상 올리기 버튼
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: 어떻게 하면 생기나요
      placeholder: |
        1. 가입하고
        2. 영상 3개를 고른 뒤 '영상 올리기'
        3. ...
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: 기대한 것 / 실제로 일어난 것
    validations: { required: true }
  - type: dropdown
    id: env
    attributes:
      label: 환경
      options: ["로컬 데모 모드", "로컬 + Supabase", "배포 사이트 (Vercel)"]
  - type: textarea
    id: extra
    attributes:
      label: 오류 메시지·스크린샷
      description: 비밀 키나 개인정보가 보이지 않게 가려 주세요
